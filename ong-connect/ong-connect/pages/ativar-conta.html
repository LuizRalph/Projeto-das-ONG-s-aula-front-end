<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Ativar conta | ONG Connect</title><link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/activation.js" defer></script></head>
<body><main class="container"><h1>Ativar conta de ONG</h1><p>Defina sua senha. O convite é válido por 24 horas e pode ser usado apenas uma vez.</p>
<form id="activation-form" class="panel"><div class="form-group"><label for="password">Senha (12 a 200 caracteres)</label><input class="field" id="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><div class="form-group"><label for="confirmation">Confirme a senha</label><input class="field" id="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></div><button class="btn" type="submit">Ativar conta</button><p id="activation-message" role="status" aria-live="polite"></p></form><p><a href="login.html">Ir para o login</a></p></main></body></html>
